; App settings, layered on PHP's php.ini-production.

expose_php = Off
memory_limit = 256M

upload_max_filesize = 20M
post_max_size = 25M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code never changes inside a running container, so skip file checks.
opcache.validate_timestamps = 0
