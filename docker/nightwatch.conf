; The Nightwatch agent, in the production image only (the dev stage deletes
; this file). The app sends it events on 127.0.0.1:2407, and it forwards them
; to Nightwatch using NIGHTWATCH_TOKEN.
[program:nightwatch]
command=php artisan nightwatch:agent
directory=/var/www/html
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
